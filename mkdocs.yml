# Configuration

theme:
  name: material
  footer:
    show:false
  logo: ./assets/Jainam_logo.svg
  features:
    - content.code.copy
    # - announce.dismiss
    - content.code.annotate
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.sections
    - navigation.instant
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

    
    # - toc.integrate
  palette:
    - scheme: default
  #     primary: white
  #     accent: indigo
  #     toggle:
  #       icon: material/brightness-7
  #       name: Switch to dark mode
  #   - scheme: slate
  #     primary: indigo
  #     accent: indigo
  #     toggle:
  #       icon: material/brightness-4
  #       name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  favicon: ./assets/Jainam_logo.svg
  icon:
    logo: logo
extra_css:
  - stylesheets/extra.css
# Plugins
plugins:
  - search
  # - redirects:
  #     redirect_maps:
  #       changelog/insiders.md: insiders/changelog.md
  #       conventions.md: philosophy.md
  #       reference/abbreviations.md: reference/tooltips.md
  #       reference/meta-tags.md: reference/index.md
  #       reference/variables.md: https://mkdocs-macros-plugin.readthedocs.io/
  #       sponsorship.md: insiders/index.md
  #       upgrading.md: upgrade.md
  # - minify:
  #     minify_html: true

  # Customization
extra:
   generator : false
  # alternate:
  #   - name: English
  #     link: /en/
  #     lang: en
  #   - name: Deutsch
  #     link: /de/
  #     lang: de

  # analytics:
  #   provider: google
  #   property: !ENV GOOGLE_ANALYTICS_KEY


social:
  #   - icon: fontawesome/brands/github
  #     link: https://github.com/squidfunk
  #   - icon: fontawesome/brands/gitter
  #     link: https://gitter.im/squidfunk/mkdocs-material
  #   - icon: fontawesome/brands/docker
  #     link: https://hub.docker.com/r/squidfunk/mkdocs-material/
  #   - icon: fontawesome/brands/python
  #     link: https://pypi.org/project/mkdocs-material/
  #   - icon: fontawesome/brands/twitter
  #     link: https://twitter.com/squidfunk

# Extensions
use_directory_urls: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - pymdownx.snippets
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.critic

# Page tree
nav:
  - SSO Authentication: index.md
  - Orders Management: orders.md
  # - Order Updates : Webhooks.md
  - Portfolio: portfolio.md
  - Funds: Funds.md
  # - HTML 5 Button : HTML 5 Button.md
  # - Basket Order: Basket Order.md
  - Profile: Profile.md
  - Appendix: Appendix.md
  - Contract Master : Contract_master.md
  # - Historical Data : historicaldata.md
  - WebSocket Streaming : WebSocket streaming.md 
  - Rates Limits : Rates Limits.md
  - Postman Scrips: postman.md


extra_javascript:
  - https://protrade.jainam.in/jspublisher/publisher.js
